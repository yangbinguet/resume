<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>核心竞赛成果</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

            background: #14536b;
        }

        .award-section {
            width: min(1000px, 100%);
            margin: 0 auto;
        }

        .award-card {
            display: grid;
            grid-template-columns: 54px minmax(0, 1fr) 150px;
            align-items: center;
            gap: 16px;

            min-height: 110px;
            padding: 16px 22px;

            color: #ffffff;

            background:
                linear-gradient(
                    110deg,
                    rgba(255, 255, 255, 0.17),
                    rgba(255, 255, 255, 0.08)
                );

            border: 1px solid rgba(183, 230, 235, 0.42);
            border-radius: 18px;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .award-icon {
            width: 54px;
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            font-size: 25px;

            background: rgba(255, 211, 77, 0.15);
            border: 1px solid rgba(255, 220, 91, 0.58);
            border-radius: 14px;
        }

        .award-content {
            min-width: 0;
        }

        .award-eyebrow {
            margin-bottom: 3px;

            color: #ffdc68;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.7px;
        }

        .award-heading {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;

            margin-bottom: 4px;
        }

        .award-title {
            margin: 0;

            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            line-height: 1.35;
        }

        .award-badge {
            display: inline-flex;
            align-items: center;

            padding: 3px 10px;

            color: #604000;
            font-size: 10px;
            font-weight: 800;

            background: #f5bd42;
            border-radius: 999px;
        }

        .award-description {
            margin: 0;

            color: rgba(255, 255, 255, 0.77);
            font-size: 11px;
            font-weight: 500;
            line-height: 1.6;
        }

        .award-money {
            padding-left: 20px;
            text-align: right;

            border-left: 1px solid rgba(255, 255, 255, 0.23);
        }

        .award-money-label {
            margin-bottom: 1px;

            color: rgba(255, 255, 255, 0.72);
            font-size: 10px;
        }

        .award-money-value {
            color: #ffd45c;
            font-size: 30px;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
        }

        .award-money-note {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
        }

        @media (max-width: 680px) {
            .award-card {
                grid-template-columns: 48px minmax(0, 1fr);
                gap: 12px;
                padding: 16px;
            }

            .award-icon {
                width: 48px;
                height: 48px;
            }

            .award-money {
                grid-column: 1 / -1;

                padding: 12px 0 0;
                text-align: left;

                border-top: 1px solid rgba(255, 255, 255, 0.2);
                border-left: 0;
            }

            .award-money-value {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="award-section">

        <div class="award-card">

            <div class="award-icon" aria-hidden="true">
                🏆
            </div>

            <div class="award-content">

                <div class="award-eyebrow">
                    CORE ACHIEVEMENT · 核心竞赛成果
                </div>

                <div class="award-heading">
                    <h2 class="award-title">
                        XX 全国大学生电子设计竞赛
                    </h2>

                    <span class="award-badge">
                        全国一等奖
                    </span>
                </div>

                <p class="award-description">
                    担任硬件负责人，负责方案设计、原理图与 PCB、器件选型及整机联调
                </p>

            </div>

            <div class="award-money">

                <div class="award-money-label">
                    团队赛事奖金
                </div>

                <div class="award-money-value">
                    ¥100,000
                </div>

                <div class="award-money-note">
                    请按实际归属修改
                </div>

            </div>

        </div>

    </div>

</body>
</html>
